name: Build

# Builds the ImmortalWrt MT798x images for every device group in the matrix:
#   check (upstream moved?) -> draft release -> build each group -> publish -> prune
# All build parameters live in the `env:` block below and in devices/<group>/config.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'devices/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM_REPO: chasey-dev/immortalwrt-mt798x-rebase
  UPSTREAM_REF: "25.12"          # alternatives: openwrt-25.12, 25.12-dev-wifi7
  TARGET: mediatek/filogic
  RELEASE_PREFIX: mt798x
  KEEP: "2"                      # newest releases to retain
  # The MTK feeds ship inside the source tree; add your own feeds here, one
  # `src-git <name> <url>` per line.
  FEEDS: ""

jobs:
  check:
    name: Check upstream
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
    outputs:
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
      need: ${{ steps.check.outputs.need }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: bash scripts/check-updates.sh

  stats:
    name: Download stats
    needs: check
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      # Refreshes the README badge every run; the prune job also folds in
      # deleted releases before removing them. No-op until the orphan `stats`
      # branch is seeded (see README).
      - run: bash scripts/download-stats.sh

  release:
    name: Create draft release
    needs: check
    if: needs.check.outputs.need == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_SHA: ${{ needs.check.outputs.upstream_sha }}
    outputs:
      tag: ${{ steps.draft.outputs.tag }}
    steps:
      - id: draft
        run: |
          set -euo pipefail
          date=$(date -u +%F)
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          tag="${RELEASE_PREFIX}-${stamp}-${GITHUB_RUN_ID}"

          {
            echo "## ImmortalWrt MT798x Build — $date"
            echo "- **Upstream**: \`${UPSTREAM_REPO}@${UPSTREAM_SHA}\` (branch \`${UPSTREAM_REF}\`)"
            echo "- **Target**: \`${TARGET}\`"
            echo "- **HNAT**: MTK PPE hardware offload enabled (\`NET_MEDIATEK_HNAT\`), managed at runtime by \`hnat-detect\`"
            echo "- **Trigger**: \`${GITHUB_EVENT_NAME}\`"
            echo
            echo "### Flashing"
            echo
            echo "Images are named \`...-<profile>-squashfs-sysupgrade.{bin,itb}\`; flash a"
            echo "sysupgrade image over an existing (Immortal)Wrt install:"
            echo "\`sysupgrade -n /tmp/<image>\`, or LuCI **System → Backup / Flash Firmware**."
            echo
            echo "A board can appear in several **flash-layout variants** — the images are"
            echo "NOT interchangeable, pick the one matching your bootloader:"
            echo
            echo "| Suffix | Bootloader / layout | First flash |"
            echo "|---|---|---|"
            echo "| \`-stock\` | vendor layout | \`*-initramfs-factory.ubi\` from the vendor/OpenWrt recovery path, then sysupgrade |"
            echo "| \`-ubootmod\` | OpenWrt U-Boot layout | \`*-initramfs-recovery.itb\` via the U-Boot web UI, then sysupgrade |"
            echo "| \`-mtkuboot\` | MTK U-Boot layout | \`*-squashfs-factory.bin\` via the MTK U-Boot web UI |"
            echo "| (none) | the board's only layout | see the board's OpenWrt/ImmortalWrt page |"
            echo
            echo "\`*-preloader.bin\`, \`*-bl31-uboot.fip\` (and \`*-emmc-gpt.bin\` where present)"
            echo "are the bootloader artifacts for (re)building that layout — not needed for"
            echo "a routine sysupgrade."
            echo
            echo "Wi-Fi ships **disabled** with no password — connect a cable, set SSID/key"
            echo "in LuCI → Network → Wireless, then enable the radios."
          } >release_notes.md

          # stdout is the tag; gh prints the release URL, which would
          # otherwise end up in it.
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "ImmortalWrt MT798x $date" \
            --notes-file release_notes.md >&2

          echo "tag=$tag" >>"$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.device }}
    needs: [check, release]
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # One entry per devices/<name>/ directory. Groups split by SoC because
        # kernel-level options (NETSYS V2/V3, HNAT) are image-wide, so boards
        # can only share a build when they share a kernel config.
        device: [mt7986]
    env:
      GH_TOKEN: ${{ github.token }}
      DEVICE: ${{ matrix.device }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - name: Install build dependencies
        run: |
          set -euo pipefail
          # ImmortalWrt builds its own flex/bison/etc. host tools, so the host
          # set is the minimal prerequisite list. rsync is for
          # prepare-build.sh's overlay step; file, wget, unzip and gh are
          # preinstalled on the runner image.
          sudo apt-get update || true
          sudo apt-get install -y \
            bzip2 g++ gawk gcc git libncurses-dev libssl-dev make rsync zlib1g-dev

      - name: Checkout ImmortalWrt source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.check.outputs.upstream_sha }}
          fetch-depth: 0
          path: openwrt

      - name: Restore mt76 (revert upstream 7e234e4615)
        working-directory: openwrt
        run: |
          set -euo pipefail
          # chasey-dev 25.12 dropped mt76 and mt7986-wo-firmware (commit
          # 7e234e4615, "may interfere with the hnat and mtwifi build"). The
          # Archer AX80 image definition is mainline-derived and needs
          # kmod-mt7915e + kmod-mt7986-firmware + mt7986-wo-firmware, and this
          # build carries no mt_wifi, so put them back. The checkout above
          # has the full history (fetch-depth: 0), so revert in place; fall
          # back to restoring the files from the parent commit if the revert
          # no longer applies cleanly.
          rev=7e234e4615
          mk=package/firmware/linux-firmware/mediatek.mk
          if ! git -c user.name=builder -c user.email=builder@localhost \
              revert --no-edit "$rev"; then
            git revert --abort || true
            git checkout "$rev^" -- package/kernel/mt76
            git show "$rev^:$mk" \
              | sed -n '/^Package\/mt7986-wo-firmware/,/^\$(eval.*mt7986-wo-firmware))/p' \
              >> "$mk"
          fi
          test -f package/kernel/mt76/Makefile
          grep -q '^Package/mt7986-wo-firmware' "$mk"

      - name: Checkout builder repo
        uses: actions/checkout@v7
        with:
          path: builder

      - name: Enable MTK HNAT in the kernel config
        working-directory: openwrt
        run: |
          set -euo pipefail
          # NET_MEDIATEK_HNAT is added by the tree's mtkhnat patch series and
          # ships disabled in the subtarget kernel config. It is not an
          # OpenWrt-level CONFIG_KERNEL_* symbol (config/Config-kernel.in),
          # so .config cannot carry it - defconfig would drop it and
          # prepare-build.sh's verification would (correctly) fail. Flip it
          # in the subtarget config instead; a glob, so a kernel bump still
          # works, and grep-guarded so a surprise fails loudly.
          cfg=""
          for f in target/linux/mediatek/filogic/config-*; do cfg="$f"; break; done
          [[ -n "$cfg" ]] || { echo "::error::no filogic kernel config found"; exit 1; }
          sed -i 's/^# CONFIG_NET_MEDIATEK_HNAT is not set$/CONFIG_NET_MEDIATEK_HNAT=y/' "$cfg"
          grep -q '^CONFIG_NET_MEDIATEK_HNAT=y$' "$cfg" || {
            echo "::error::could not enable NET_MEDIATEK_HNAT in $cfg"; exit 1; }

      - name: Prepare build environment
        env:
          OPENWRT_DIR: ${{ github.workspace }}/openwrt
          BUILDER_REPO: ${{ github.workspace }}/builder
        run: bash builder/scripts/prepare-build.sh

      - name: Set reproducible-build env
        working-directory: openwrt
        run: |
          set -euo pipefail
          {
            echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)"
            echo "TZ=UTC"
            echo "LC_ALL=C"
            echo "KBUILD_BUILD_USER=builder"
            echo "KBUILD_BUILD_HOST=github"
          } >>"$GITHUB_ENV"

      - name: Download sources
        working-directory: openwrt
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            make download -j"$(nproc)" V=s && break
            echo "Download attempt $attempt failed; retrying..."
            sleep 5
          done

      - name: Build
        working-directory: openwrt
        run: |
          set -euo pipefail
          # Parallel first; on failure rerun single-threaded and verbose so
          # the failing package is visible in the log.
          make -j"$(nproc)" || make -j1 V=s

      - name: Upload images
        run: |
          set -euo pipefail
          out="openwrt/bin/targets/${TARGET}"

          # Sysupgrade + factory + recovery images and the bootloader
          # artifacts (preloader/fip/gpt) — everything needed to flash or
          # recover a board. Image names carry the profile, so the groups
          # never collide in the release. The build metadata is uploaded under
          # the group name - it is the answer to "what exactly was in this
          # image".
          mapfile -t assets < <(find "$out" -maxdepth 1 -type f \( \
            -name '*-squashfs-sysupgrade.*' -o \
            -name '*-initramfs-kernel.bin' -o \
            -name '*-squashfs-factory.*' -o \
            -name '*-factory.ubi' -o \
            -name '*-recovery.itb' -o \
            -name '*-preloader.bin' -o \
            -name '*-bl31-uboot.fip' -o \
            -name '*-gpt.bin' \
          \) | sort)
          [[ ${#assets[@]} -gt 0 ]] || { echo "::error::no images in $out"; exit 1; }
          find "$out" -maxdepth 1 -name '*-squashfs-sysupgrade.*' | grep -q . || {
            echo "::error::no sysupgrade images in $out"; exit 1; }
          cp "$out/sha256sums" "sha256sums-${DEVICE}.txt"
          cp "$out/config.buildinfo" "config-${DEVICE}.buildinfo"

          # --clobber, so re-running a job that died mid-upload is a recovery
          # and not a permanent "asset already exists".
          for attempt in 1 2 3; do
            gh release upload "$TAG" \
              --repo "$GITHUB_REPOSITORY" --clobber \
              "${assets[@]}" "sha256sums-${DEVICE}.txt" "config-${DEVICE}.buildinfo" && break
            [[ $attempt -lt 3 ]] || { echo "::error::upload failed after $attempt attempts"; exit 1; }
            echo "::warning::upload attempt $attempt failed; retrying"
            sleep 15
          done

          {
            echo "## ${DEVICE}"
            echo "- assets: ${#assets[@]}"
          } >>"$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish release
    needs: [release, build]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release.outputs.tag }}
      BUILD_RESULT: ${{ needs.build.result }}
    steps:
      - name: Publish or discard
        run: |
          set -euo pipefail
          if [[ "$BUILD_RESULT" != "success" ]]; then
            # A half-built release would silently be missing device groups,
            # and a draft left behind is never pruned. Drop it and fail. No
            # --cleanup-tag: a draft's tag exists only inside the release.
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
            echo "::error::a build group failed ($BUILD_RESULT); draft release discarded"
            exit 1
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  prune:
    name: Prune old releases
    needs: publish
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - name: Prune
        run: PREFIX="$RELEASE_PREFIX" bash scripts/prune-releases.sh
